  "_comment": [
    "Every byte of the engine Lukotta ships, pinned and checksummed.",
    "vendor-engine.sh fetches exactly these and refuses anything else, so the",
    "app does not depend on what happens to be installed on the build machine.",
    "bottle_tag sets the lowest macOS the built app can run on: libblkid comes",
    "from that bottle and carries its minimum.",
    "The two crates under 'imago' and 'krun-devices' are patched by build-engine.sh; their checksums are the ones anylinuxfs's own Cargo.lock records for them."
