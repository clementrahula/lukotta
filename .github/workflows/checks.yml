name: Checks

# Every push to main, every pull request, and on request. It ran on pull
# requests alone while the repository was private, a macOS runner being billed
# at ten times a Linux one; a public repository is not billed at all.
#
# Everything here is what can be checked
# without a real drive: the package builds, the unit checks pass, the bundle is
# assembled, every screen is drawn and compared with its baseline, the binary
# starts, and the whole lot is linted.
#
# Two things are deliberately not here, and cannot be.
#
# The Linux engine is not staged. Finishing the guest image means booting it,
# and a hosted runner cannot start a virtual machine: `anylinuxfs init` gets as
# far as `start vm error: Invalid argument`. build-app.sh assembles the bundle
# without it and says so, which is enough for everything checked here.
#
# scripts/e2e.sh is not run. It needs that same virtual machine and Full Disk
# Access besides. It runs on a real Mac.
#
# The screens are not compared here either. A baseline is a picture of what one
# machine drew: a runner has a different macOS build and draws every screen
# differently, so all of them differ and none of the differences mean anything.
# scripts/snapshots.sh compares them where they were recorded.

# Not on every push. A macOS runner is billed at ten times the rate of a Linux
# one while this repository is private, and a run for each of eight commits in
# twenty minutes is most of a month's allowance for nothing anybody read. Pull
# requests and asking for it are enough until the repository is public, when
# the minutes stop being counted.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The only thing this workflow's token is for is the checkout above it. Left
# unsaid, the token is whatever the repository hands out by default, which is
# a wider grant than any step here asks for and one that changes with a
# setting nobody edits while thinking about this file.
permissions:
  contents: read

# No concurrency group. It existed to cancel a superseded run, and instead it
# wedged: a run that sat queued -- which is what a macOS runner shortage looks
# like -- held the group, and pushes after it created no run at all. Not a
# failed run, not a queued one: nothing, with nothing anywhere saying why. A
# gate that silently stops running is worse than one that runs twice, and on a
# public repository the second run costs nothing.

jobs:
  check:
    # Named Checks, not CI, and that is not cosmetic. A workflow run that GitHub
# wedges in "queued" cannot be cancelled, force-cancelled or deleted -- all
# three are refused -- and while one sat there, pushes created no run at all:
# not a failure, not a queue, nothing. Two releases went out today with no
# checks behind them for that reason. A run belongs to a workflow, so a
# workflow with a new identity starts with none of them.
#
# macos-latest rather than a pinned image. A pinned one is a label GitHub
    # provisions for a while and then does not: runs against macos-15 stopped
    # being picked up mid-afternoon and sat queued for hours, with no error and
    # nothing in the run to say why, which is indistinguishable from a runner
    # shortage. The toolchain is pinned below instead, where it can be checked
    # and where a wrong one fails loudly rather than never starting.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The whole history, not the tip. The gitleaks pass below reads it,
        # and against the single commit a default checkout fetches it passes by
        # seeing nothing.
        with:
          fetch-depth: 0

      # Pinned rather than whatever the image happens to carry. The errors CI
      # found before it was turned off were real ones a newer local SDK does not
      # produce, and a runner that quietly moves to another Xcode turns a
      # failure into a mystery. Selected explicitly, and the version it actually
      # got is checked against the one this project is built with.
      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          swift --version
          xcodebuild -version
          swift package tools-version
          have="$(swift --version | sed -n 's/.*Apple Swift version \([0-9]*\)\.\([0-9]*\).*/\1\2/p' | head -1)"
          [ -n "$have" ] || { echo "could not read the Swift version"; exit 1; }
          [ "$have" -ge 60 ] || { echo "Swift 6 or later is required; this is $have"; exit 1; }

      # Run on their own rather than through build-app.sh, so that what they
      # print is in the log when they fail.
      #
      # Built and then run, rather than `swift run`: a runner kills the binary
      # at exec when nothing has signed it, before it prints a word. An ad-hoc
      # signature is enough to satisfy that.
      - name: Unit checks
        run: |
          swift build -c release --product LukottaTests
          codesign --force --sign - .build/release/LukottaTests
          ./.build/release/LukottaTests

      # The two applications that are actually shipped. The unbranded build is
      # a local convenience and nobody receives it, so checking it here would
      # check a bundle identifier, an icon set, a daemon name and a feed that
      # no release ever uses -- and would miss the ones that do.
      #
      # Without vendor/engine both warn and carry on, which is what is wanted
      # here. The checks have already run above.
      - name: Build both applications
        run: |
          LUKOTTA_INSTALL=0 LUKOTTA_SKIP_TESTS=1 LUKOTTA_BRANDING=official ./build-app.sh
          LUKOTTA_INSTALL=0 LUKOTTA_SKIP_TESTS=1 LUKOTTA_BRANDING=beta ./build-app.sh

      - name: Smoke test both
        run: |
          for app in "Lukotta" "Lukotta Beta"; do
            bundle="./dist/$app.app"
            echo "== $app =="
            "$bundle/Contents/MacOS/$app" --smoke-test
            # The app is the bundle's executable and nothing stands in front of
            # it: macOS gives no menu bar item to a process whose running image
            # is not the executable the bundle declares, which is what a
            # launcher handing over with execv produced. A build that puts one
            # back starts here and nowhere else -- there is no menu bar on a
            # runner to notice the item missing from.
            test -x "$bundle/Contents/MacOS/$app"
            test ! -e "$bundle/Contents/MacOS/$app-app"
            # And the watcher that puts the previous version back when an
            # update will not load, which is the one thing the app cannot
            # notice about itself.
            test -x "$bundle/Contents/MacOS/update-check"
            "$bundle/Contents/MacOS/$app" --verify-launch
          done
          # The two must never collide: same Mac, both installed, and every
          # name that decides whose daemon, whose feed and whose saved
          # passphrases is which has to differ.
          release_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' './dist/Lukotta.app/Contents/Info.plist')"
          beta_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' './dist/Lukotta Beta.app/Contents/Info.plist')"
          test "$release_id" != "$beta_id"
          release_feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' './dist/Lukotta.app/Contents/Info.plist')"
          beta_feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' './dist/Lukotta Beta.app/Contents/Info.plist')"
          test "$release_feed" != "$beta_feed"
          echo "release $release_id -> $release_feed"
          echo "beta    $beta_id -> $beta_feed"

      # Before anything is built: what a scanner can know, over the whole
      # history rather than the tip. The hook that runs the same checks before
      # a commit exists can be skipped, and on somebody else's clone it may
      # never have been installed at all.
      - name: Nothing private, anywhere in the history
        run: |
          brew install gitleaks
          gitleaks detect --redact --no-banner --config .gitleaks.toml

      - name: Lint, and whether the checks are keeping up
        run: |
          brew install shellcheck swift-format
          ./scripts/lint.sh
