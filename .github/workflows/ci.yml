name: CI

# Manual only, for now. It was running on every push and failing, and the
# failures were arriving as email rather than as something anyone was looking
# at. To be wired back up deliberately, with a toolchain pinned to match what
# the app is actually built with.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # The suite is a plain executable, not a test target: XCTest and
      # swift-testing both need a full Xcode install, and the tests should run
      # anywhere the package builds.
      - name: Tests
        run: swift run LukottaTests

      - name: Recovery-key validator
        run: ./scripts/test-key-validator.sh

      - name: Format
        run: swift format lint --recursive --strict Sources

      - name: Shell scripts
        run: |
          brew install shellcheck
          shellcheck -e SC1091,SC2317 ./*.sh ./scripts/*.sh

  # Producing a signed bundle needs the vendored engine and a signing identity,
  # neither of which exists on a runner. Enable once vendoring is reproducible
  # from pinned upstream artefacts — see TODO.md section 1.
