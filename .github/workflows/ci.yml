name: CI

# Every push and every pull request. Everything here is what can be checked
# without a real drive: the package builds, the checks pass, the bundle is
# assembled from the pinned engine, every screen is drawn and compared with its
# baseline, and the binary starts.
#
# scripts/e2e.sh is not here. It boots a virtual machine and needs Full Disk
# Access, and a hosted runner has neither. It runs on a real Mac.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          swift --version
          xcodebuild -version

      # Pinned by checksum, so the same key means the same bytes.
      - name: Cache the engine
        uses: actions/cache@v4
        with:
          path: |
            vendor/engine
            vendor/upstream
            vendor/.cache
          key: engine-${{ hashFiles('vendor/engine.lock') }}

      - name: Fetch and stage the engine
        run: |
          ./scripts/fetch-engine.sh
          ./scripts/vendor-engine.sh

      # Runs the checks itself and refuses to build when they fail, so this is
      # the unit tests as well as the bundle.
      - name: Build the app
        run: LUKOTTA_INSTALL=0 ./build-app.sh

      - name: Smoke test
        run: |
          "./dist/Drive Unlocker.app/Contents/MacOS/Drive Unlocker" --smoke-test

      - name: Screens
        run: ./scripts/snapshots.sh

      - name: Recovery-key validator
        run: ./scripts/test-key-validator.sh

      - name: Lint, and whether the checks are keeping up
        run: |
          brew install shellcheck swift-format
          ./scripts/lint.sh

      # What was drawn when it did not match, so a difference can be judged
      # rather than guessed at.
      - name: Keep the screens that differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: tests/snapshots
          retention-days: 7
