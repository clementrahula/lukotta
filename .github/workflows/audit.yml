name: Audit

# What is shipped, checked against what is known to be wrong with it.
#
# Three ecosystems end up inside this app and each has its own advisory
# database:
#
#   Swift      the packages the app links, checked by OSV
#   Rust       the crates the engine is built from, checked by cargo-audit
#   Alpine     the 66 packages of the Linux guest, checked by Trivy
#
# Weekly, because an advisory can be published for code that has not changed,
# and on demand.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: Swift packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: "--lockfile=Package.resolved"
        continue-on-error: false

  rust:
    name: Engine crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The crates are pinned in vendor/engine.lock and fetched by checksum, so
      # what is audited is what is compiled.
      - name: Fetch the pinned crate sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/crates
          python3 - <<'PY'
          import json, urllib.request, hashlib, pathlib
          lock = json.load(open("vendor/engine.lock"))
          for name in ("imago", "krun-devices"):
              entry = lock[name]
              data = urllib.request.urlopen(entry["source_url"]).read()
              got = hashlib.sha256(data).hexdigest()
              if got != entry["source_sha256"]:
                  raise SystemExit(f"{name}: checksum mismatch")
              path = pathlib.Path("/tmp/crates") / f"{name}.crate"
              path.write_bytes(data)
              print(f"{name} {entry['version']} verified")
          PY
          cd /tmp/crates && for f in *.crate; do tar xzf "$f"; done
          ls /tmp/crates

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          # Each crate is audited against its own manifest. A crate without a
          # lockfile is resolved first, so the advisory check sees versions
          # rather than ranges.
          for dir in /tmp/crates/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "== $dir"
            # Vulnerabilities fail this. A crate merely marked unmaintained
            # does not: it is reported, and it is not something a dependency of
            # a dependency can be made to stop being.
            ( cd "$dir" && cargo generate-lockfile >/dev/null 2>&1 || true
              cargo audit ) || exit 1
          done

  guest:
    name: Alpine guest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # What is scanned is vendor/guest-sbom.json: the package database of the
      # trimmed image, written by vendor-engine.sh and committed.
      #
      # It used to be the base image pulled from the registry by the digest in
      # engine.lock. That is not the thing that ships. "anylinuxfs init" boots
      # that image and installs into it, and trim-image.py takes packages back
      # out again; the registry copy holds 16 packages and the guest holds 66.
      # CVE-2026-14456 was caught only because OpenSSL happens to sit in the
      # base layer -- an advisory against nfs-utils, cryptsetup, krb5-libs,
      # python3 or sqlite-libs would have gone unseen. Scanning the inventory
      # instead needs no macOS and no engine, which is what the registry scan
      # was for.
      - name: Check the inventory is the one the notices describe
        # Both files are generated from the same package database, so they
        # cannot disagree unless one was regenerated and the other was not. A
        # stale SBOM is worse than no SBOM: it is a green tick over an image
        # nobody scanned.
        run: |
          python3 - <<'PY'
          import json, re, sys

          bom = json.load(open("vendor/guest-sbom.json"))
          sbom = {
              (c["name"], c["version"])
              for c in bom["components"] if c["type"] == "library"
          }

          notices, inside = set(), False
          for line in open("THIRD_PARTY_NOTICES.md", encoding="utf-8"):
              if line.startswith("## Linux Guest Image"):
                  inside = True
                  continue
              if inside and line.startswith("## "):
                  break
              m = re.match(r"^\| ([a-z0-9][a-z0-9._+-]*) \| ([^|]+?) \| [^|]+ \|\s*$", line)
              if inside and m:
                  notices.add((m.group(1), m.group(2).strip()))

          if sbom != notices:
              for what, rows in (("only in the SBOM", sbom - notices),
                                 ("only in the notices", notices - sbom)):
                  for name, version in sorted(rows):
                      print(f"  {what}: {name} {version}")
              sys.exit(
                  "error: vendor/guest-sbom.json and THIRD_PARTY_NOTICES.md "
                  "describe different images.\n"
                  "       Re-run scripts/vendor-engine.sh and "
                  "scripts/generate-notices.sh together.")
          print(f"{len(sbom)} packages, agreeing with the notices")
          PY

      - name: Trivy
        # Pinned to the commit rather than the tag. The Trivy releases were
        # briefly compromised (GHSA-69fq-xp46-6x23), and a tag can be moved
        # where a commit cannot.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: vendor/guest-sbom.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
