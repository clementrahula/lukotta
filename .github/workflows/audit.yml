name: Audit

# What is shipped, checked against what is known to be wrong with it.
#
# Three ecosystems end up inside this app and each has its own advisory
# database:
#
#   Swift      the packages the app links, checked by OSV
#   Rust       the crates the engine is built from, checked by cargo-audit
#   Alpine     the packages of the Linux guest, checked by Trivy
#
# It runs on a push to any branch, not only main. What it reads --
# Package.resolved, vendor/engine.lock, vendor/guest-sbom.json -- are files in
# the commit, and a release is cut from whatever branch it is cut from. Graded
# on main alone, the verdict was about a different commit, and a ship from a
# working branch found no run at all and read green over a three-week-old red.
# What this file settles is that every pushed commit gets a run; whether the
# commit being tagged is one of them is scripts/ship.sh's question, answered
# there by matching a run's head against its own HEAD and treating anything
# else as a gate that did not answer. What neither can catch: an advisory can
# be published against code that has not changed, so this answer is only ever
# as fresh as the last push.
#
# A red run here does stop a release, where Engine updates does not. This is
# about the soundness of what is being shipped, which is what scripts/ship.sh
# asks before it tags.

on:
  push:
    branches: ['**']
  workflow_dispatch:

# A burst of pushes collapses to one run: only the newest commit is worth a
# verdict. These are ubuntu jobs, where cancelling a superseded run costs
# nothing and frees a runner. Checks has no such group because its macOS
# runners are scarce: the group wedged there and pushes created no run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: Swift packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: "--lockfile=Package.resolved"
        continue-on-error: false

  rust:
    name: Engine crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The crates are pinned in vendor/engine.lock and fetched by checksum, so
      # what is audited is what is compiled.
      - name: Fetch the pinned crate sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/crates
          python3 - <<'PY'
          import json, urllib.request, hashlib, pathlib
          lock = json.load(open("vendor/engine.lock"))
          for name in ("imago", "krun-devices"):
              entry = lock[name]
              data = urllib.request.urlopen(entry["source_url"]).read()
              got = hashlib.sha256(data).hexdigest()
              if got != entry["source_sha256"]:
                  raise SystemExit(f"{name}: checksum mismatch")
              path = pathlib.Path("/tmp/crates") / f"{name}.crate"
              path.write_bytes(data)
              print(f"{name} {entry['version']} verified")
          PY
          cd /tmp/crates && for f in *.crate; do tar xzf "$f"; done
          ls /tmp/crates

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          # Each crate is audited against its own manifest. A crate without a
          # lockfile is resolved first, so the advisory check sees versions
          # rather than ranges.
          for dir in /tmp/crates/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "== $dir"
            # Vulnerabilities fail this. A crate merely marked unmaintained
            # does not: it is reported, and it is not something a dependency of
            # a dependency can be made to stop being.
            ( cd "$dir" && cargo generate-lockfile >/dev/null 2>&1 || true
              cargo audit ) || exit 1
          done

  guest:
    name: Alpine guest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What is scanned is vendor/guest-sbom.json: the package database of the
      # trimmed image, written by vendor-engine.sh and committed.
      #
      # It used to be the base image pulled from the registry by the digest in
      # engine.lock. That is not the thing that ships. "anylinuxfs init" boots
      # that image and installs into it, and trim-image.py takes packages back
      # out again; the registry copy holds a fraction of what the guest ships.
      # CVE-2026-14456 was caught only because OpenSSL happens to sit in the
      # base layer -- an advisory against nfs-utils, cryptsetup, krb5-libs,
      # python3 or sqlite-libs would have gone unseen. Scanning the inventory
      # instead needs no macOS and no engine, which is what the registry scan
      # was for.
      - name: Check the inventory is the one the notices describe
        # The notices table is rendered from this same SBOM, so what is checked
        # here is that render against what is committed. It runs the script the
        # release gate runs, rather than a second implementation of it that
        # could be corrected in one place and not the other. A stale SBOM is
        # worse than no SBOM: it is a green tick over an image nobody scanned.
        run: bash scripts/generate-notices.sh --check

      - name: Trivy
        # Pinned to the commit rather than the tag. The Trivy releases were
        # briefly compromised (GHSA-69fq-xp46-6x23), and a tag can be moved
        # where a commit cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: vendor/guest-sbom.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
