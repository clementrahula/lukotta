name: Engine updates

# Dependabot cannot see vendor/engine.lock, so this looks instead. It changes
# nothing: bumping the engine means reading what changed and looking at
# Diagnosis.enginesChecked, because the rules that explain a failure match on
# the words the engine prints.
#
# SCRIBE: say why this runs on pushes to main and on request rather than on a
# schedule; why it stays a workflow of its own rather than becoming a job in
# Checks -- a red run here means a pinned part moved upstream, not that the
# build is bad, and scripts/ship.sh reads the last completed run on the branch
# as the verdict on what is being shipped, so a drift failure inside Checks
# would stand between a finished build and somebody installing it; and that it
# clears by bumping the lock or recording the new version as _declined.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SCRIBE: say why this job is not called check: main requires a status check
  # by that name, and a second check run called check on the same commit -- red
  # for drift while the build's own is green -- is a gate nobody can read.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SCRIBE: say that a source that could not be reached is not drift and
      # does not fail this, because the next push asks again.
      - name: What has moved
        run: |
          status=0
          ./scripts/check-engine-updates.sh || status=$?
          if [ "$status" = "2" ]; then exit 0; fi
          exit "$status"
