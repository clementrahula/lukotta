name: Something else
description: Wording, interface, documentation, or a suggestion.
body:
  - type: markdown
    attributes:
      value: |
        Anything that could expose a passphrase or the contents of a drive goes
        to the private form on the Security tab, not here.
  - type: textarea
    id: detail
    attributes:
      label: What is wrong, or what you would like
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the bottom of the Help screen. Leave blank if it does not apply.
